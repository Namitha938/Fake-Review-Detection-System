version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fake_review_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fake_review_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake_review_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db:3306/fake_review_db
      - SECRET_KEY=super-secret-jwt-key-for-fake-review-detection-2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml_models:/app/ml_models
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fake_review_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:

